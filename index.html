<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>電気計算ツール</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--line:#2a3a52;--text:#eef4ff;--muted:#aab8ce;--accent:#64d9c3;--accent2:#8bb7ff;--danger:#ff9a9a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#101827,#0b1220 40%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.5}
header{padding:22px 16px 14px;max-width:900px;margin:auto}
h1{font-size:1.45rem;margin:0 0 5px}
header p{margin:0;color:var(--muted);font-size:.92rem}
main{max-width:900px;margin:auto;padding:0 12px 40px}
.notice{background:#182a3c;border:1px solid #31516a;border-radius:12px;padding:12px;margin:0 0 14px;font-size:.86rem;color:#d9e8f8}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;background:#0d1625;z-index:5}
.tab{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--text);white-space:nowrap;font-size:.9rem;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#06221d;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0002}
.card h2{font-size:1.08rem;margin:0 0 5px}
.desc{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{min-width:0}
label{display:block;color:#d6e2f5;font-size:.88rem;margin-bottom:5px}
input,select{width:100%;min-width:0;border:1px solid #3a4d67;border-radius:10px;background:#0b1422;color:var(--text);padding:12px;font-size:1rem}
input:disabled,select:disabled{background:#16202e;color:#5a6e85;border-color:#223246;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:10px;padding:11px 14px;font-size:.95rem;font-weight:650;background:var(--accent);color:#06221d;cursor:pointer}
button.secondary{background:#26364d;color:var(--text);border:1px solid #40536d}
.result{margin-top:14px;padding:13px;border-radius:12px;background:#0b1724;border:1px solid #29465a;overflow-wrap:anywhere}
.result .big{font-size:1.35rem;font-weight:750;color:var(--accent);margin:2px 0}
.result .small{font-size:.86rem;color:var(--muted)}
.calc-step{background:#132235;border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:.88rem}
.error{color:var(--danger);font-size:.9rem;margin-top:10px}
.hidden{display:none!important}
.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcd6ff;font-size:.86rem;overflow-wrap:anywhere}
footer{max-width:900px;margin:auto;padding:0 16px 28px;color:var(--muted);font-size:.8rem}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>電気計算ツール</h1>
  <p>直流・単相・三相の基本計算／現場での確認用</p>
</header>
<main>
  <div id="globalError" class="notice hidden" style="background:#3b2832;border-color:#74424b;color:#ffdede;margin-bottom:14px;"></div>
  <div class="notice">計算結果は目安・確認用です。電線選定や電圧降下は敷設条件等を必ずご確認ください。</div>
  
  <nav class="tabs" aria-label="計算機能">
    <button class="tab active" data-tab="power">電力・回路</button>
    <button class="tab" data-tab="pf">力率・kVA</button>
    <button class="tab" data-tab="drop">電圧降下</button>
    <button class="tab" data-tab="wire">電線選定補助</button>
    <button class="tab" data-tab="freq">周波数・回転数</button>
  </nav>

  <!-- ① 電力・回路タブ -->
  <section id="power" class="tabpage">
    <div class="card">
      <h2>電圧・電流・電力・抵抗（オームの法則・電力）</h2>
      <p class="desc">任意の2項目を入力すると残りが自動でロックされます。</p>
      <div class="grid">
        <div class="field"><label for="basicV">電圧 V（V）</label><input id="basicV" class="basic-input" type="number" min="0" step="any" placeholder="例：100"></div>
        <div class="field"><label for="basicI">電流 I（A）</label><input id="basicI" class="basic-input" type="number" min="0" step="any" placeholder="例：5"></div>
        <div class="field"><label for="basicP">電力 P（W）</label><input id="basicP" class="basic-input" type="number" min="0" step="any" placeholder="例：500"></div>
        <div class="field"><label for="basicR">抵抗 R（Ω）</label><input id="basicR" class="basic-input" type="number" min="0" step="any" placeholder="例：20"></div>
      </div>
      <div class="actions"><button id="btnBasicCalc">計算する</button><button class="secondary" id="btnClearBasic">クリア</button></div>
      <div id="basicResult" class="result hidden" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2>単相・三相交流計算</h2>
      <div class="grid">
        <div class="field"><label for="acPhase">回路</label><select id="acPhase"><option value="3">三相3線式</option><option value="1">単相</option></select></div>
        <div class="field"><label for="acMode">計算目的</label><select id="acMode"><option value="p">有効電力 P（kW）</option><option value="i">電流 I（A）</option><option value="v">電圧 V（V）</option></select></div>
        <div class="field" id="fieldAcV"><label for="acV">電圧（V）</label><input id="acV" type="number" min="0" step="any" value="200"></div>
        <div class="field" id="fieldAcI"><label for="acI">電流（A）</label><input id="acI" type="number" min="0" step="any" placeholder="例：10"></div>
        <div class="field hidden" id="fieldAcP"><label for="acP">有効電力 P（kW）</label><input id="acP" type="number" min="0" step="any" placeholder="例：3.5"></div>
        <div class="field"><label for="acPf">力率（0～1）</label><input id="acPf" type="number" min="0" max="1" step="any" value="0.8"></div>
      </div>
      <div class="actions"><button id="btnAcCalc">計算する</button><button class="secondary" id="btnAcClear">クリア</button></div>
      <div id="acResult" class="result hidden" aria-live="polite"></div>
    </div>
  </section>

  <!-- ② 力率・kVAタブ -->
  <section id="pf" class="tabpage hidden">
    <div class="card">
      <h2>有効電力・皮相電力・無効電力・力率</h2>
      <div class="grid">
        <div class="field"><label for="pfP">有効電力 P（kW）</label><input id="pfP" type="number" min="0" step="any" placeholder="例：80"></div>
        <div class="field"><label for="pfS">皮相電力 S（kVA）</label><input id="pfS" type="number" min="0" step="any" placeholder="例：100"></div>
      </div>
      <div class="actions"><button id="btnPfCalc">計算する</button><button class="secondary" id="btnPfClear">クリア</button></div>
      <div id="pfResult" class="result hidden" aria-live="polite"></div>
    </div>
  </section>

  <!-- ③ 電圧降下タブ -->
  <section id="drop" class="tabpage hidden">
    <div class="card">
      <h2>電圧降下計算（簡易）</h2>
      <div class="grid">
        <div class="field"><label for="dropPhase">回路</label><select id="dropPhase"><option value="1">単相2線式</option><option value="3">三相3線式</option></select></div>
        <div class="field"><label for="dropI">電流（A）</label><input id="dropI" type="number" min="0" step="any" placeholder="例：20"></div>
        <div class="field"><label for="dropL">片道の長さ（m）</label><input id="dropL" type="number" min="0" step="any" placeholder="例：30"></div>
        <div class="field"><label for="dropArea">導体断面積（mm²）</label><select id="dropArea"><option>2</option><option>3.5</option><option>5.5</option><option>8</option><option>14</option><option>22</option><option>38</option><option>60</option></select></div>
        <div class="field"><label for="dropV">電源電圧（V）</label><input id="dropV" type="number" min="0" step="any" value="200"></div>
      </div>
      <div class="actions"><button id="btnDropCalc">計算する</button><button class="secondary" id="btnDropClear">クリア</button></div>
      <div id="dropResult" class="result hidden" aria-live="polite"></div>
    </div>
  </section>

  <!-- ④ 電線選定タブ -->
  <section id="wire" class="tabpage hidden">
    <div class="card">
      <h2>電線サイズ選定の補助</h2>
      <div class="grid">
        <div class="field"><label for="wireI">設計電流（A）</label><input id="wireI" type="number" min="0" step="any" placeholder="例：25"></div>
        <div class="field"><label for="wireMargin">余裕率（%）</label><input id="wireMargin" type="number" min="0" step="any" value="25"></div>
      </div>
      <div class="actions"><button id="btnWireCalc">候補を表示</button><button class="secondary" id="btnWireClear">クリア</button></div>
      <div id="wireResult" class="result hidden" aria-live="polite"></div>
    </div>
  </section>

  <!-- ⑤ 周波数タブ -->
  <section id="freq" class="tabpage hidden">
    <div class="card">
      <h2>周波数・同期回転数</h2>
      <div class="grid">
        <div class="field"><label for="freqHz">周波数（Hz）</label><input id="freqHz" type="number" min="0" step="any" value="60"></div>
        <div class="field"><label for="freqPoles">極数</label><select id="freqPoles"><option value="2">2極</option><option value="4" selected>4極</option><option value="6">6極</option></select></div>
      </div>
      <div class="actions"><button id="btnFreqCalc">計算する</button><button class="secondary" id="btnFreqClear">クリア</button></div>
      <div id="freqResult" class="result hidden" aria-live="polite"></div>
    </div>
  </section>
</main>

<script>
window.addEventListener('error', function(e) {
  const errBox = document.getElementById('globalError');
  if(errBox) {
    errBox.textContent = 'スクリプトエラー: ' + e.message + ' (行 ' + e.lineno + ')';
    errBox.classList.remove('hidden');
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(registrations => {
    for (let reg of registrations) reg.unregister();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const val = id => { const n = Number($(id).value); return $(id).value.trim() !== '' && Number.isFinite(n) ? n : NaN; };
  const fmt = (n, d = 3) => !Number.isFinite(n) ? '—' : n.toLocaleString('ja-JP', { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const show = (id, html) => { $(id).innerHTML = html; $(id).classList.remove('hidden'); };
  const err = (id, msg) => show(id, `<div class="error">${msg}</div>`);
  const clearFields = (ids, resultId) => {
    ids.forEach(id => $(id).value = '');
    if (resultId) $(resultId).classList.add('hidden');
    handleBasicInputLock();
  };

  // タブ
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tabpage').forEach(p => p.classList.toggle('hidden', p.id !== btn.dataset.tab));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  // オームロック
  const basicInputs = document.querySelectorAll('.basic-input');
  function handleBasicInputLock() {
    const filled = Array.from(basicInputs).filter(i => i.value.trim() !== '' && !isNaN(Number(i.value)));
    if (filled.length >= 2) {
      basicInputs.forEach(i => { if (i.value.trim() === '' || isNaN(Number(i.value))) i.disabled = true; });
    } else {
      basicInputs.forEach(i => i.disabled = false);
    }
  }
  basicInputs.forEach(i => i.addEventListener('input', handleBasicInputLock));
  $('btnClearBasic').addEventListener('click', () => {
    clearFields(['basicV', 'basicI', 'basicP', 'basicR'], 'basicResult');
    basicInputs.forEach(i => i.disabled = false);
  });

  $('btnBasicCalc').addEventListener('click', () => {
    const v = val('basicV'), i = val('basicI'), p = val('basicP'), r = val('basicR');
    const hasV = Number.isFinite(v) && v >= 0;
    const hasI = Number.isFinite(i) && i >= 0;
    const hasP = Number.isFinite(p) && p >= 0;
    const hasR = Number.isFinite(r) && r >= 0;
    let calcP = p, calcV = v, calcI = i, calcR = r, steps = [];

    if (hasV && hasI) {
      calcP = v * i; calcR = i > 0 ? v / i : NaN;
      steps.push({ name: '電力 P', val: `${fmt(calcP)} W`, formula: 'P = V × I' });
      steps.push({ name: '抵抗 R', val: `${fmt(calcR)} Ω`, formula: 'R = V ÷ I' });
    } else if (hasV && hasR) {
      calcI = r > 0 ? v / r : NaN; calcP = v * calcI;
      steps.push({ name: '電流 I', val: `${fmt(calcI)} A`, formula: 'I = V ÷ R' });
      steps.push({ name: '電力 P', val: `${fmt(calcP)} W`, formula: 'P = V² ÷ R' });
    } else if (hasV && hasP) {
      calcI = v > 0 ? p / v : NaN; calcR = calcI > 0 ? v / calcI : NaN;
      steps.push({ name: '電流 I', val: `${fmt(calcI)} A`, formula: 'I = P ÷ V' });
      steps.push({ name: '抵抗 R', val: `${fmt(calcR)} Ω`, formula: 'R = V² ÷ P' });
    } else if (hasI && hasR) {
      calcV = i * r; calcP = calcV * i;
      steps.push({ name: '電圧 V', val: `${fmt(calcV)} V`, formula: 'V = I × R' });
      steps.push({ name: '電力 P', val: `${fmt(calcP)} W`, formula: 'P = I² × R' });
    } else if (hasI && hasP) {
      calcV = i > 0 ? p / i : NaN; calcR = i > 0 ? calcV / i : NaN;
      steps.push({ name: '電圧 V', val: `${fmt(calcV)} V`, formula: 'V = P ÷ I' });
      steps.push({ name: '抵抗 R', val: `${fmt(calcR)} Ω`, formula: 'R = P ÷ I²' });
    } else if (hasP && hasR) {
      calcV = Math.sqrt(p * r); calcI = r > 0 ? calcV / r : NaN;
      steps.push({ name: '電圧 V', val: `${fmt(calcV)} V`, formula: 'V = √(P × R)' });
      steps.push({ name: '電流 I', val: `${fmt(calcI)} A`, formula: 'I = √(P ÷ R)' });
    } else {
      return err('basicResult', '入力項目をちょうど2つ入力してください。');
    }

    let stepsHtml = steps.map(s => `<div class="calc-step"><b>【${s.name}】 ${s.val}</b><br>公式：${s.formula}</div>`).join('');
    show('basicResult', `<div class="small">計算結果</div>${stepsHtml}`);
  });

  // AC切替
  $('acMode').addEventListener('change', () => {
    const mode = $('acMode').value;
    $('fieldAcV').classList.toggle('hidden', mode === 'v');
    $('fieldAcI').classList.toggle('hidden', mode === 'i');
    $('fieldAcP').classList.toggle('hidden', mode === 'p');
    $('acResult').classList.add('hidden');
  });

  $('btnAcCalc').addEventListener('click', () => {
    const phase = Number($('acPhase').value), mode = $('acMode').value, pf = val('acPf');
    const is3 = phase === 3, sqrt3 = Math.sqrt(3);
    if (!(pf > 0 && pf <= 1)) return err('acResult', '力率は0～1で指定してください。');
    if (mode === 'p') {
      const v = val('acV'), i = val('acI');
      if (!(v > 0) || !(i >= 0)) return err('acResult', '電圧と電流を入力してください。');
      const p = ((is3 ? sqrt3 : 1) * v * i * pf) / 1000;
      show('acResult', `<div class="small">有効電力</div><div class="big">${fmt(p)} kW</div>`);
    } else if (mode === 'i') {
      const v = val('acV'), p = val('acP');
      if (!(v > 0) || !(p >= 0)) return err('acResult', '電圧と有効電力を入力してください。');
      const i = (p * 1000) / ((is3 ? sqrt3 : 1) * v * pf);
      show('acResult', `<div class="small">電流</div><div class="big">${fmt(i)} A</div>`);
    } else if (mode === 'v') {
      const i = val('acI'), p = val('acP');
      if (!(i > 0) || !(p >= 0)) return err('acResult', '電流と有効電力を入力してください。');
      const v = (p * 1000) / ((is3 ? sqrt3 : 1) * i * pf);
      show('acResult', `<div class="small">電圧</div><div class="big">${fmt(v)} V</div>`);
    }
  });
  $('btnAcClear').addEventListener('click', () => clearFields(['acV', 'acI', 'acP', 'acPf'], 'acResult'));

  // その他簡易ボタン
  $('btnPfCalc').addEventListener('click', () => {
    const p = val('pfP'), s = val('pfS');
    if (!(p > 0) || !(s > 0) || p > s) return err('pfResult', '有効電力と正しい皮相電力（P≤S）を入力してください。');
    show('pfResult', `<div class="small">結果</div>力率：<b>${fmt(p/s, 4)}</b>（${fmt(p/s*100, 1)}%）`);
  });
  $('btnPfClear').addEventListener('click', () => clearFields(['pfP', 'pfS'], 'pfResult'));

  $('btnDropCalc').addEventListener('click', () => {
    const phase = $('dropPhase').value, i = val('dropI'), l = val('dropL'), area = Number($('dropArea').value), v = val('dropV');
    if (!(i > 0) || !(l > 0) || !(v > 0)) return err('dropResult', '正しい値を入力してください。');
    let drop = (phase === '3') ? (Math.sqrt(3) * i * l * 0.0175) / area : (2 * i * l * 0.0175) / area;
    show('dropResult', `<div class="small">結果</div>電圧降下：<b>${fmt(drop)} V</b>（${fmt(drop/v*100, 2)}%）`);
  });
  $('btnDropClear').addEventListener('click', () => clearFields(['dropI', 'dropL', 'dropV'], 'dropResult'));

  $('btnWireCalc').addEventListener('click', () => {
    const i = val('wireI'), margin = val('wireMargin');
    if (!(i > 0) || !(margin >= 0)) return err('wireResult', '数値を入力してください。');
    const target = i * (1 + margin / 100);
    show('wireResult', `<div class="small">結果</div>設計電流＋余裕：<b>${fmt(target)} A</b> 相当以上`);
  });
  $('btnWireClear').addEventListener('click', () => clearFields(['wireI', 'wireMargin'], 'wireResult'));

  $('btnFreqCalc').addEventListener('click', () => {
    const hz = val('freqHz'), poles = Number($('freqPoles').value);
    if (!(hz > 0)) return err('freqResult', '周波数を入力してください。');
    show('freqResult', `<div class="small">結果</div>同期回転数：<b>${fmt((120 * hz) / poles, 1)} rpm</b>`);
  });
  $('btnFreqClear').addEventListener('click', () => clearFields(['freqHz'], 'freqResult'));
});
</script>
</body>
</html>
