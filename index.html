<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>電気計算ツール</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--line:#2a3a52;--text:#eef4ff;--muted:#aab8ce;--accent:#64d9c3;--accent2:#8bb7ff;--danger:#ff9a9a;--law-bg:#162436;--law-border:#334966}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#101827,#0b1220 40%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.5}
header{padding:22px 16px 14px;max-width:900px;margin:auto}
h1{font-size:1.45rem;margin:0 0 5px}
header p{margin:0;color:var(--muted);font-size:.92rem}
main{max-width:900px;margin:auto;padding:0 12px 40px}
.notice{background:#182a3c;border:1px solid #31516a;border-radius:12px;padding:12px;margin:0 0 14px;font-size:.86rem;color:#d9e8f8}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;background:#0d1625;z-index:5}
.tab{border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--panel);color:var(--text);white-space:nowrap;font-size:.9rem;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#06221d;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #0002}
.card h2{font-size:1.08rem;margin:0 0 5px}
.desc{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{min-width:0}
label{display:block;color:#d6e2f5;font-size:.88rem;margin-bottom:5px}
input,select{width:100%;min-width:0;border:1px solid #3a4d67;border-radius:10px;background:#0b1422;color:var(--text);padding:12px;font-size:1rem}
input:disabled,select:disabled{background:#16202e;color:#5a6e85;border-color:#223246;cursor:not-allowed}
input:focus,select:focus,button:focus{outline:2px solid var(--accent2);outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:10px;padding:11px 14px;font-size:.95rem;font-weight:650;background:var(--accent);color:#06221d;cursor:pointer}
button.secondary{background:#26364d;color:var(--text);border:1px solid #40536d}
.result{margin-top:14px;padding:13px;border-radius:12px;background:#0b1724;border:1px solid #29465a;overflow-wrap:anywhere}
.result .big{font-size:1.35rem;font-weight:750;color:var(--accent);margin:2px 0}
.result .small{font-size:.86rem;color:var(--muted)}
.calc-step{background:#132235;border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:.88rem}
.calc-step div{margin-bottom:2px}
.error{color:var(--danger);font-size:.9rem;margin-top:10px}
.hidden{display:none!important}
.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcd6ff;font-size:.86rem;overflow-wrap:anywhere;margin-top:8px}

/* 法令・根拠表示用のスタイル */
details.law-info{margin-top:14px;background:var(--law-bg);border:1px solid var(--law-border);border-radius:10px;padding:8px 12px;font-size:.84rem}
